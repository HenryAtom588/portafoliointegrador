<!DOCTYPE html>
<html lang="es">
<head>
   <!-- Metadatos básicos -->
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Portafolio profesional con información sobre mi experiencia, proyectos y habilidades">
   <meta name="keywords" content="desarrollador web, portafolio, HTML, CSS, proyectos">
   <meta name="author" content="Tu Nombre">
   
   <!-- Título de la página -->
   <title>Mi Portafolio Profesional</title>
   
   <!-- Enlace al archivo CSS principal -->
   <link rel="stylesheet" href="css/main.css">
   
   <!-- Fuentes de Google -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<body>
    <!-- Encabezado -->
    <title>Portafolio - Desarrollador Web Junior</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header, footer {
      background: #007BFF;
      color: #fff;
      padding: 10px 20px;
      text-align: center;
    }
    section {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1, h2 {
      color: #007BFF;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    ul li {
      margin: 10px 0;
    }
    .btn {
      display: inline-block;
      background: #007BFF;
      color: #fff;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
    }
    .btn:hover {
      background: #0056b3;
    }
  </style>
